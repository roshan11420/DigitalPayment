<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container">
    <nav>
        <div class="brand">Digital Wallet</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/register.html">Register</a>
        </div>
    </nav>

    <div class="auth-card">
        <h2>Login</h2>
        <form id="loginForm" class="form-grid">
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com" />
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required placeholder="Enter password" />
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="loginAlert" class="alert"></div>
        <p style="margin-top: 12px; text-align: center;">New user? <a class="small-link" href="/register.html">Create account</a></p>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();
        if (!response.ok) {
            showAlert('loginAlert', 'error', result.message || 'Login failed');
            return;
        }

        setToken(result.token);
        showAlert('loginAlert', 'success', 'Login successful. Redirecting...');
        setTimeout(() => window.location.href = '/dashboard.html', 500);
    });
</script>
</body>
</html>
