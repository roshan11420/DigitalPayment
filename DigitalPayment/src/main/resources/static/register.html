<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container">
    <nav>
        <div class="brand">Digital Wallet</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/login.html">Login</a>
        </div>
    </nav>

    <div class="auth-card">
        <h2>Create account</h2>
        <form id="registerForm" class="form-grid">
            <div>
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" required placeholder="Jane Doe" />
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com" />
            </div>
            <div>
                <label for="mobile">Mobile number</label>
                <input id="mobile" name="mobile" type="tel" required placeholder="9876543210" maxlength="10" />
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required placeholder="At least 6 chars" />
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="registerAlert" class="alert"></div>
        <p style="margin-top: 12px; text-align: center;">Already have an account? <a class="small-link" href="/login.html">Login</a></p>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const payload = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            password: document.getElementById('password').value.trim()
        };

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok) {
            showAlert('registerAlert', 'error', result.message || 'Registration failed');
            return;
        }

        setToken(result.token);
        showAlert('registerAlert', 'success', 'Registration successful. Redirecting...');
        setTimeout(() => window.location.href = '/dashboard.html', 500);
    });
</script>
</body>
</html>
